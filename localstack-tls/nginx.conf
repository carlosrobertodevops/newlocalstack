worker_processes 1;
events { worker_connections 1024; }

http {
  client_max_body_size 0;
  proxy_buffering off;
  proxy_request_buffering off;
  proxy_http_version 1.1;

  # Plain HTTP listener — OrbStack auto-proxy hits :80 when no scheme
  # is forced. Redirect to the HTTPS endpoint on the same host.
  server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 4569 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    location / {
      proxy_pass http://localstack:4566;
      # $http_host preserves the original "Host: localhost:4569" header (with port);
      # $host alone strips the port and breaks the Azure /metadata/endpoints URL builder.
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      proxy_connect_timeout 60s;
    }
  }
}
