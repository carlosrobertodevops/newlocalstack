[localstack.hooks.on_infra_shutdown]
run_on_after_service_shutdown_handlers = localstack.platform.runtime.shutdown:run_on_after_service_shutdown_handlers
run_shutdown_handlers = localstack.platform.runtime.shutdown:run_shutdown_handlers
shutdown_services = localstack.platform.runtime.shutdown:shutdown_services

[localstack.hooks.on_infra_start]
apply_aws_runtime_patches = localstack.aws.patches:apply_aws_runtime_patches
apply_runtime_patches = localstack.platform.runtime.patches:apply_runtime_patches

