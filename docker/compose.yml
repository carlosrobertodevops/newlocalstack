services:
  localstack:
    container_name: "${LOCALSTACK_DOCKER_NAME:-localstack-main}"
    image: ${LOCALSTACK_IMAGE:-localstack/localstack-custom}
    ports:
      - "127.0.0.1:4566:4566" # New LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559" # external services port range
    labels:
      # OrbStack auto-proxy: edge gateway listens on 4566 (not 80).
      dev.orbstack.http-port: "4566"
    environment:
      # LocalStack configuration: https://docs.localstack.cloud/references/configuration/
      - DEBUG=${DEBUG:-0}
      - PERSISTENCE=${PERSISTENCE:-1}
      # OrbStack auto-domain (<container>.<project>.orb.local) + UI sidecar + outros origins via env
      - EXTRA_CORS_ALLOWED_ORIGINS=${EXTRA_CORS_ALLOWED_ORIGINS:-https://localstack-ui.localstack.orb.local,http://localstack-ui.localstack.orb.local,https://localstack.localstack.orb.local,http://localstack.localstack.orb.local,https://localstack-tls.localstack.orb.local,http://localstack-tls.localstack.orb.local,http://localhost:4577,http://127.0.0.1:4577,http://localhost:5173,http://127.0.0.1:5173,http://localhost:4578,http://127.0.0.1:4578}
      # Permite que CORS responda mesmo para sub-domínios *.orb.local (dev only).
      - DISABLE_CORS_CHECKS=${DISABLE_CORS_CHECKS:-1}
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-../.cache/volume}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
      # Init hooks (ready.d) — cria buckets default p/ evitar 404 NoSuchBucket em dev
      - "../localstack-init:/etc/localstack/init"
      # NOTE: do NOT bind-mount localstack-core/localstack subdirs here. The
      # editable install resolves the `localstack` namespace package across
      # multiple paths (incl. /usr/lib/localstack/python-packages), and
      # any bind-mount under it breaks `localstack.runtime` import.
      # Instead run `make docker-sync` to copy post-build source changes
      # (ecr/ecs/eks/rds providers, gcp gateway/models patches) and commit
      # them into the image. See bin/docker-sync.sh.
  localstack-ui:
    container_name: localstack-ui
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:4577:80"
    labels:
      # OrbStack auto-proxy: explicit HTTP port (nginx listens on 80 inside).
      dev.orbstack.http-port: "80"
    volumes:
      # Serves the built console SPA (run `make console-build` to populate dist/).
      # legacy.html is copied from console/public/ into dist/ by Vite at build time.
      - "../localstack-ui/console/dist:/usr/share/nginx/html:ro"
      # Proxies /_localstack/* → localstack:4566 and /_bridge/* → host:4578.
      - "../localstack-ui/console/nginx.conf:/etc/nginx/nginx.conf:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - localstack
    restart: unless-stopped
  # Optional host-side CLI bridge for the console (bin/console-cli-bridge).
  # Documented in docs/multi-cloud-console-plan.md §3.5, §4. Runs on the host
  # by default — only enable this service if you have built a container that
  # ships aws/az/gcloud (heavy).
  # localstack-console-bridge:
  #   container_name: localstack-console-bridge
  #   image: python:3.12-alpine
  #   ports:
  #     - "127.0.0.1:4578:4578"
  #   volumes:
  #     - "./bin:/app/bin:ro"
  #     - "./localstack-core:/app/localstack-core:ro"
  #   working_dir: /app
  #   command: ["python", "/app/bin/console-cli-bridge", "--host", "0.0.0.0"]
  #   restart: unless-stopped
  localstack-tls:
    container_name: localstack-tls
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:4569:4569"
      # Port 443 lets azurerm reach the sidecar without ":4569" in the URL,
      # which the provider rejects when parsing storage account IDs.
      # Requires the host to have :443 free; OrbStack/Docker Desktop bind
      # without elevation. Comment out if conflicting with another service.
      - "127.0.0.1:443:4569"
    labels:
      # OrbStack auto-proxy: TLS sidecar speaks HTTPS on 4569. Use
      # https-port (not http-port) so the proxy talks TLS upstream —
      # otherwise nginx replies "400 plain HTTP to HTTPS port".
      # Plain HTTP requests on :80 are redirected to HTTPS by the
      # server block below (see localstack-tls/nginx.conf).
      dev.orbstack.https-port: "4569"
      dev.orbstack.http-port: "80"
    volumes:
      - "../localstack-tls/nginx.conf:/etc/nginx/nginx.conf:ro"
      - "../localstack-tls/certs:/etc/nginx/certs:ro"
    depends_on:
      - localstack
    restart: unless-stopped
